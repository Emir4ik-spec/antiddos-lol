<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Plate preview | antiddos.lol</title>
<link rel="stylesheet" href="verify.css?v=31">
<style>
.mt { justify-content: flex-start; padding-top: 0; overflow: hidden; --cy: #22d3ee; --pl-line: rgba(255,255,255,.09); --pl-fill: rgba(255,255,255,.028); --pl-fill2: rgba(34,211,238,.075); --pl-dim: rgba(255,255,255,.42); --pl-lol: #22d3ee; --pl-glow: rgba(34,211,238,.13); }
.mt-light { --cy: #0e7fa8; --pl-line: rgba(0,0,0,.09); --pl-fill: rgba(0,0,0,.02); --pl-fill2: rgba(14,127,168,.05); --pl-dim: rgba(0,0,0,.45); --pl-lol: #0e7fa8; --pl-glow: rgba(14,165,233,.075); }
.mt::before { content: ''; position: absolute; z-index: 0; top: -180px; left: 50%; width: 900px; height: 460px; transform: translateX(-50%); pointer-events: none; background: radial-gradient(closest-side, var(--pl-glow), transparent); }
.mt > * { position: relative; z-index: 1; }
.mt-foot { position: absolute; }
.mt-main { margin: 0; padding-top: 0; }
.pl-gap { flex: 1 1 0; min-height: 34px; width: 100%; }

.pl { display: block; width: min(100%, 640px); height: 132px; color: inherit; text-decoration: none; animation: pl-in .9s cubic-bezier(.22, 1, .36, 1) both; }
.pl-shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pl-in { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 27px; gap: 11px; }
.pl-logo { display: flex; align-items: center; gap: 12px; }
.pl-mark { width: 36px; height: 36px; flex: none; filter: drop-shadow(0 0 10px var(--pl-glow)); }
.pl-word { font-family: 'Unbounded', 'Onest', sans-serif; font-weight: 600; font-size: clamp(20px, 5vw, 27px); letter-spacing: -0.03em; line-height: 1; }
.pl-word em { font-style: normal; color: var(--pl-lol); }
.pl-tag { font-family: 'Onest', sans-serif; font-size: 8.5px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: var(--pl-dim); padding-left: .34em; }
.pl .pulse { stroke-dasharray: 1; stroke-dashoffset: 0; animation: pl-draw 1.1s .55s cubic-bezier(.4, 0, .2, 1) both; }
.pl:hover .pulse { animation: pl-draw .9s cubic-bezier(.4, 0, .2, 1); }
.pl-edge { transition: opacity .3s; }
.pl:hover .pl-edge, .pl:focus-visible .pl-edge { opacity: 1; }
.pl:focus-visible { outline: none; }
.pl-line { position: relative; width: 1px; flex: 1 1 0; min-height: 34px; margin: 0 auto 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--cy) 75%, transparent), transparent); animation: pl-in 1s .15s both; }
.pl-line::after { content: ''; position: absolute; left: -2px; top: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--cy); box-shadow: 0 0 10px 2px var(--cy); animation: pl-run 3.2s 1.2s cubic-bezier(.5, 0, .9, .6) infinite; }
@keyframes pl-run { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { top: calc(100% - 5px); opacity: 0; } }
@keyframes pl-in { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
@keyframes pl-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.mt-main .mt-title { margin-top: 20px; }
@media (max-width: 460px) { .pl-tag { letter-spacing: .26em; } }
@media (prefers-reduced-motion: reduce) { .pl, .pl-line, .pl .pulse, .pl-line::after { animation: none; } .pl-line::after { display: none; } }
</style>
</head>
<body>
<div id="guard-page" class="mt">
  <a class="pl" href="https://antiddos.lol" target="_blank" rel="noopener" aria-label="antiddos.lol">
    <svg class="pl-shape" viewBox="0 0 640 132" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="plf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pl-fill)"/><stop offset="1" stop-color="var(--pl-fill2)"/></linearGradient>
        <linearGradient id="pls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pl-line)"/><stop offset=".55" stop-color="var(--pl-line)"/><stop offset="1" stop-color="var(--cy)"/></linearGradient>
      </defs>
      <path d="M0 0V54C0 94 118 112 320 131C522 112 640 94 640 54V0Z" fill="url(#plf)"/>
      <path class="pl-edge" d="M0 0V54C0 94 118 112 320 131C522 112 640 94 640 54V0" fill="none" stroke="url(#pls)" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".9"/>
    </svg>
    <span class="pl-in">
      <span class="pl-logo">
        <svg class="pl-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="plg" x1="5" y1="3" x2="27" y2="29" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="0.55" stop-color="#A5F3FC"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient></defs><path d="M16 2.9 26.6 6.6v9.2c0 6.4-4.2 10.7-10.6 13.3C9.6 26.5 5.4 22.2 5.4 15.8V6.6z" fill="#04070A" stroke="url(#plg)" stroke-width="2.1" stroke-linejoin="round"/><path class="pulse" pathLength="1" d="M9.6 16.6h3l2-4.6 2.7 8 1.8-3.4h3.3" stroke="#22D3EE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="pl-word">antiddos<em>.lol</em></span>
      </span>
      <span class="pl-tag">DDoS mitigation</span>
    </span>
  </a>
  <div class="pl-line" aria-hidden="true"></div>

  <main class="mt-main">
    <h1 class="mt-title">Additional Verification Required</h1>
    <p class="mt-sub">Please complete the CAPTCHA below to proceed</p>
    <div class="mt-card is-ready">
      <div class="mt-ind"><input id="antiddos-check" class="mt-cbx-in" type="checkbox"><label class="mt-cbx" for="antiddos-check"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.75 12.25 L9.75 17.25 L19.25 6.75" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></label></div>
      <p class="mt-txt">I'm not a robot</p>
    </div>
  </main>
  <div class="pl-gap" aria-hidden="true"></div>

  <footer class="mt-foot">
    <p class="mt-contact">If you are experiencing any issues, please contact us at: <a href="mailto:support@antiddos.lol">support@antiddos.lol</a></p>
  </footer>
</div>
<script>
if (/[?&]light/.test(location.search) || (!/[?&]dark/.test(location.search) && matchMedia('(prefers-color-scheme: light)').matches)) document.getElementById('guard-page').classList.add('mt-light');
</script>
</body>
</html>
