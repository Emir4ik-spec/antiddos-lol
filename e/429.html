<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>429 Too many requests | AntiDDos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.antiddos.lol/verify.css">
<style>[hidden]{display:none!important}</style>
</head>
<body>
  <div class="mt">
    <main class="mt-main mt-err" id="err">
      <div class="mt-code" aria-hidden="true">429</div>
      <h1 class="mt-title" data-ru="Слишком много запросов">Too many requests</h1>
      <p class="mt-sub mt-sub-wait" data-ru="Вы отправляете запросы слишком часто. Подождите немного и повторите.">You are sending requests too fast. Wait a moment and try again.</p>
    </main>
    <footer class="mt-foot">
      <p class="mt-brand"><a href="https://antiddos.lol" target="_blank" rel="noopener">AntiDDos DDos Mitigation</a></p>
    </footer>
  </div>
<script>
(function () {
  if (/^ru\b/i.test(navigator.language || '')) {
    document.documentElement.lang = 'ru'
    document.querySelectorAll('[data-ru]').forEach(function (el) { el.textContent = el.getAttribute('data-ru') })
  }
})()
</script>
</body>
</html>
