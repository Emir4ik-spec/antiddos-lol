<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>502 Bad gateway | AntiDDos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.antiddos.lol/verify.css">
<style>[hidden]{display:none!important}</style>
</head>
<body>
  <div class="mt">
    <main class="mt-main mt-err" id="err">
      <div class="mt-code" aria-hidden="true">502</div>
      <h1 class="mt-title" data-ru="Сервер сайта не отвечает">Bad gateway</h1>
      <p class="mt-sub mt-sub-wait" data-ru="Не удалось связаться с сервером сайта. Повторите попытку чуть позже.">We couldn't reach the website's server. Please try again shortly.</p>
      <div class="mt-actions">
        <button type="button" class="mt-btn mt-btn-primary" id="primary" data-ru="Повторить">Try again</button>
        <a class="mt-btn" href="/" data-ru="На главную">Home</a>
      </div>
    </main>
    <footer class="mt-foot">
      <p class="mt-brand"><a href="https://antiddos.lol" target="_blank" rel="noopener">AntiDDos DDos Mitigation</a></p>
    </footer>
  </div>
<script>
(function () {
  if (/^ru\b/i.test(navigator.language || '')) {
    document.documentElement.lang = 'ru'
    document.querySelectorAll('[data-ru]').forEach(function (el) { el.textContent = el.getAttribute('data-ru') })
  }
  document.getElementById('primary').onclick = function () { location.reload() }
})()
</script>
</body>
</html>
