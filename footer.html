.mt-main { margin: 0; }

.ft { position: absolute; left: 50%; bottom: 0; z-index: 2; width: min(100%, 640px); height: 120px; transform: translateX(-50%); border-radius: clamp(44px, 12.5vw, 80px) clamp(44px, 12.5vw, 80px) 0 0; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 30px; gap: 11px; color: inherit; text-decoration: none; background: var(--ft-fill); animation: ft-in 1s cubic-bezier(.22, 1, .36, 1) both; }

.ft::before { background: linear-gradient(0deg, var(--ft-rim0), var(--ft-rim1)); }

.ft-glow { position: absolute; z-index: -1; left: 0; right: 0; top: 0; height: 100%; pointer-events: none; background: radial-gradient(55% 90% at 50% 0, var(--ft-glow), transparent 75%); }
.ft-logo { display: flex; align-items: center; gap: 12px; }
.ft-mark { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 0 12px var(--ft-glow)); }
.ft-word { font-family: 'Unbounded', 'Onest', sans-serif; font-weight: 600; font-size: clamp(21px, 5.2vw, 28px); letter-spacing: -0.03em; line-height: 1; }
.ft-word em { font-style: normal; color: var(--ft-lol); }
.ft-tag { display: flex; align-items: center; gap: 10px; font-family: 'Onest', sans-serif; font-size: 8.5px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: var(--ft-dim); }
.ft-tag i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; }
.ft .pulse { stroke-dasharray: 1; stroke-dashoffset: 0; animation: ft-draw 1.1s .7s cubic-bezier(.4, 0, .2, 1) both; }
.ft:hover .pulse { animation: ft-draw .9s cubic-bezier(.4, 0, .2, 1); }
.ft:focus-visible { outline: 2px solid var(--cy); outline-offset: -4px; }
@keyframes ft-in { from { opacity: 0; transform: translate(-50%, 18px); } to { opacity: 1; transform: translateX(-50%); } }
@keyframes ft-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes ft-sweep { 0% { background-position: 130% 0; } 55%, 100% { background-position: -30% 0; } }
@media (prefers-reduced-motion: reduce) { .ft, .ft .pulse { animation: none; } .ft::after { display: none; } }
