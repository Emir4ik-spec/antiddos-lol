<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Error | AntiDDos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.antiddos.lol/verify.css">
<style>[hidden]{display:none!important}</style>
</head>
<body>
  <div class="mt">
    <main class="mt-main mt-err" id="err" hidden>
      <div class="mt-code" id="code" aria-hidden="true"></div>
      <h1 class="mt-title" id="title"></h1>
      <p class="mt-sub mt-sub-wait" id="text"></p>
      <div class="mt-actions">
        <button type="button" class="mt-btn mt-btn-primary" id="primary"></button>
        <a class="mt-btn" id="home" href="/"></a>
      </div>
    </main>
    <main class="mt-main" id="direct" hidden>
      <h1 class="mt-title" id="dtitle"></h1>
      <div class="mt-actions"><a class="mt-btn mt-btn-primary" href="https://antiddos.lol">antiddos.lol</a></div>
    </main>
    <footer class="mt-foot">
      <p class="mt-brand"><a href="https://antiddos.lol" target="_blank" rel="noopener">AntiDDos DDos Mitigation</a></p>
    </footer>
  </div>
<script>window.__code=504</script>
<script>
(function () {
  var ru = /^ru\b/i.test(navigator.language || '')
  var T = {
    400: ['Bad request', 'The server could not understand the request. Check the address and try again.', 'Некорректный запрос', 'Сервер не понял запрос. Проверьте адрес и попробуйте снова.', 'back'],
    403: ['Access denied', "You don't have permission to view this page.", 'Доступ запрещён', 'У вас нет прав для просмотра этой страницы.', 'back'],
    404: ['Page not found', 'The page may have been moved, or there is a typo in the address.', 'Страница не найдена', 'Возможно, страницу перенесли или в адресе опечатка.', 'back'],
    429: ['Too many requests', 'You are sending requests too fast. Wait a moment and try again.', 'Слишком много запросов', 'Вы отправляете запросы слишком часто. Подождите немного и повторите.', 'retry'],
    500: ['Server error', 'Something went wrong on our side. Please try again in a moment.', 'Ошибка сервера', 'Что-то пошло не так на нашей стороне. Повторите попытку чуть позже.', 'retry'],
    502: ['Bad gateway', "We couldn't reach the website's server. Please try again shortly.", 'Сервер сайта не отвечает', 'Не удалось связаться с сервером сайта. Повторите попытку чуть позже.', 'retry'],
    503: ['Service unavailable', 'The service is temporarily unavailable. Please try again later.', 'Сервис недоступен', 'Сервис временно недоступен. Попробуйте позже.', 'retry'],
    504: ['Gateway timeout', 'The server took too long to respond. Please try again.', 'Сервер долго отвечает', 'Сервер слишком долго отвечает. Повторите попытку.', 'retry']
  }
  document.documentElement.lang = ru ? 'ru' : 'en'

  // Страницу отдаёт защищаемый сайт (edge подставляет её вместо ответа при ошибке).
  // Открытая напрямую по адресу cdn, она ничего не показывает.
  if (location.hostname === 'cdn.antiddos.lol') {
    document.title = 'AntiDDos'
    document.getElementById('dtitle').textContent = ru ? 'Страница открывается только через защищаемый сайт' : 'This page only opens through a protected website'
    document.getElementById('direct').hidden = false
    return
  }

  var raw = window.__code || parseInt(new URLSearchParams(location.search).get('code'), 10)
  var code = T[raw] ? raw : (raw >= 500 ? 500 : 400)
  var t = T[code]
  document.title = code + ' ' + t[0] + ' | AntiDDos'
  document.getElementById('code').textContent = code
  document.getElementById('title').textContent = ru ? t[2] : t[0]
  document.getElementById('text').textContent = ru ? t[3] : t[1]
  document.getElementById('home').textContent = ru ? 'На главную' : 'Home'
  var primary = document.getElementById('primary')
  if (t[4] === 'retry') {
    primary.textContent = ru ? 'Повторить' : 'Try again'
    primary.onclick = function () { location.reload() }
  } else {
    primary.textContent = ru ? 'Назад' : 'Go back'
    primary.onclick = function () { if (history.length > 1) history.back(); else location.href = '/' }
  }
  document.getElementById('err').hidden = false
})()
</script>
</body>
</html>
