<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>504 Gateway timeout | AntiDDos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.antiddos.lol/verify.css">
<style>[hidden]{display:none!important}</style>
</head>
<body>
  <div class="mt">
    <main class="mt-main mt-err" id="err">
      <div class="mt-code" aria-hidden="true">504</div>
      <h1 class="mt-title" data-ru="Сервер долго отвечает">Gateway timeout</h1>
      <p class="mt-sub mt-sub-wait" data-ru="Сервер слишком долго отвечает. Повторите попытку.">The server took too long to respond. Please try again.</p>
      <div class="mt-actions">
        <button type="button" class="mt-btn mt-btn-primary" id="primary" data-ru="Повторить">Try again</button>
        <a class="mt-btn" href="/" data-ru="На главную">Home</a>
      </div>
    </main>
    <main class="mt-main" id="direct" hidden>
      <h1 class="mt-title" data-ru="Страница открывается только через защищаемый сайт">This page only opens through a protected website</h1>
      <div class="mt-actions"><a class="mt-btn mt-btn-primary" href="https://antiddos.lol">antiddos.lol</a></div>
    </main>
    <footer class="mt-foot">
      <p class="mt-brand"><a href="https://antiddos.lol" target="_blank" rel="noopener">AntiDDos DDos Mitigation</a></p>
    </footer>
  </div>
<script>
(function () {
  if (/^ru\b/i.test(navigator.language || '')) {
    document.documentElement.lang = 'ru'
    document.querySelectorAll('[data-ru]').forEach(function (el) { el.textContent = el.getAttribute('data-ru') })
  }
  // Страницу отдаёт защищаемый сайт вместо ответа с ошибкой; напрямую с адреса cdn она ничего не показывает.
  if (location.hostname === 'cdn.antiddos.lol') {
    document.title = 'AntiDDos'
    document.getElementById('err').hidden = true
    document.getElementById('direct').hidden = false
    return
  }
  document.getElementById('primary').onclick = function () { location.reload() }
})()
</script>
</body>
</html>
