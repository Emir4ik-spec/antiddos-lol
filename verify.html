<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification required | antiddos.lol</title>
<meta name="robots" content="noindex, nofollow">
<link id="adl-fav-ico" rel="icon">
<link id="adl-fav-touch" rel="apple-touch-icon">
<script>
// The tab icon should be the CLIENT's own (cakeworld.pw's favicon, not antiddos.lol's) while
// their visitor is being checked. /api/guard/client-logo resolves it per host — an uploaded
// logo, or one auto-discovered from the protected site's own <head>/favicon.ico — and answers
// 204 for ?favicon=1 when it found nothing, which a <link> pointing at a 204 simply shows no
// icon for (browser default) instead of wearing our brand on someone else's tab. No static href
// on the tags above: setting it here, before the browser would otherwise request the old
// hardcoded antiddos.lol icon, is what makes this apply on first paint, not just on repeat visits.
(function () {
  var url = '/api/guard/client-logo?host=' + encodeURIComponent(location.hostname) + '&favicon=1'
  document.getElementById('adl-fav-ico').href = url
  document.getElementById('adl-fav-touch').href = url
})()
</script>
<link rel="stylesheet" href="https://cdn.antiddos.lol/verify.css?v=42">
<style>[v-cloak]{display:none}</style>
</head>
<body>
  <div id="guard-page" class="mt" v-cloak :class="{ 'mt-light': s.theme === 'light' }">

    <main class="mt-main" v-if="s.mode === 'card' && s.state !== 'fatal'">
      <h1 class="mt-title" v-text="text('title')"></h1>
      <p class="mt-sub" v-text="text('lead')"></p>
      <div class="mt-card" :class="['is-' + s.state, { 'mt-out': s.leaving }]">
        <template v-if="s.state === 'captcha'">
          <div class="mt-col">
            <div class="mt-head">
              <span class="mt-cbx" :class="{ on: s.checked }" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4.75 12.25 L9.75 17.25 L19.25 6.75" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span class="mt-txt" v-text="text('checkbox')"></span>
              <a class="mt-by" href="https://antiddos.lol" target="_blank" rel="noopener" :aria-label="text('by')"><span v-text="text('by')"></span><img :src="staticBase + 'brand-logo.svg'" alt=""></a>
            </div>
            <div class="mt-widget" id="vf-widget"></div>
          </div>
        </template>
        <template v-else>
          <div class="mt-ind">
            <template v-if="s.state === 'ready'">
              <input id="antiddos-check" class="mt-cbx-in" type="checkbox">
              <label class="mt-cbx" :class="{ on: s.checked }" for="antiddos-check" @click.prevent="click()"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.75 12.25 L9.75 17.25 L19.25 6.75" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
            </template>
            <span class="mt-ringwrap" :class="{ 'is-spin': !s.pct }" v-else-if="s.state === 'progress'" aria-hidden="true"><svg class="mt-ring" viewBox="0 0 24 24">
              <circle class="mt-ring-bg" cx="12" cy="12" r="9"/>
              <circle class="mt-ring-fg" cx="12" cy="12" r="9" :style="{ strokeDashoffset: 56.55 * (1 - (s.pct || 28) / 100) }"/>
            </svg></span>
            <span class="mt-mark mt-ok" :class="{ 'is-static': s.tick }" v-else-if="s.state === 'success'" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4.75 12.25 L9.75 17.25 L19.25 6.75" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="mt-mark mt-no" v-else-if="s.state === 'error'" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 7 L17 17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M17 7 L7 17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
          </div>
          <p class="mt-txt"><span class="mt-t" :data-k="s.key" v-text="text(s.key)"></span> <b class="mt-pct" v-if="tail" v-text="tail"></b></p>
          <div class="mt-steps" :class="{ 'is-on': step > 0 && step < 5 }" aria-hidden="true"><i :class="{ 'is-done': 1 < step, 'is-cur': 1 === step }"><b :style="1 === step ? bar : null"></b></i><i :class="{ 'is-done': 2 < step, 'is-cur': 2 === step }"><b :style="2 === step ? bar : null"></b></i><i :class="{ 'is-done': 3 < step, 'is-cur': 3 === step }"><b :style="3 === step ? bar : null"></b></i><i :class="{ 'is-done': 4 < step, 'is-cur': 4 === step }"><b :style="4 === step ? bar : null"></b></i></div>
          <a class="mt-by" href="https://antiddos.lol" target="_blank" rel="noopener" :aria-label="text('by')"><span v-text="text('by')"></span><img :src="staticBase + 'brand-logo.svg'" alt=""></a>
        </template>
      </div>
    </main>

    <main class="mt-main" v-else-if="showWait">
      <h1 class="mt-title" v-text="text('waitTitle')"></h1>
      <p class="mt-sub mt-sub-wait" v-text="text('waitText')"></p>
    </main>

    <main class="mt-main" v-else-if="s.state === 'fatal'">
      <h1 class="mt-title" v-text="text(s.key === 'direct' ? 'directTitle' : 'failTitle')"></h1>
      <p class="mt-sub mt-sub-wait" v-text="text(s.key === 'error' ? 'errorFatal' : s.key)"></p>
      <button type="button" class="mt-btn" v-if="s.retry" @click="retryClick()" v-text="text('retry')"></button>
    </main>

    <footer class="mt-foot" v-if="s.state !== 'boot' && !(s.mode === 'invisible' && s.state !== 'fatal')">
      <p class="mt-brand"><a href="https://antiddos.lol" target="_blank" rel="noopener">Powered by antiddos.lol</a></p>
      <p class="mt-contact" v-if="s.state === 'fatal'"><span v-text="text('contact')"></span> <a href="mailto:support@antiddos.lol">support@antiddos.lol</a></p>
    </footer>
  </div>

<script src="/api/guard/core"></script>
<script type="module" src="https://cdn.antiddos.lol/ui.js?v=31"></script>
</body>
</html>
