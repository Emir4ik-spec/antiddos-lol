<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification required | antiddos.lol</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.antiddos.lol/verify.css">
<style>[v-cloak]{display:none}</style>
</head>
<body>
  <div id="guard-page" class="mt" v-cloak :class="{ 'mt-light': s.theme === 'light' }">

    <main class="mt-main" v-if="s.mode === 'card' && s.state !== 'fatal'">
      <h1 class="mt-title" v-text="text('title')"></h1>
      <p class="mt-sub" v-text="text('lead')"></p>
      <div class="mt-card" :class="{ 'mt-out': s.leaving }">
        <div class="mt-row" v-if="s.state === 'ready'">
          <input id="antiddos-check" class="mt-cbx-in" type="checkbox">
          <label class="mt-cbx" for="antiddos-check" @click.prevent="click()"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5 L9.5 18 L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
          <p class="mt-txt" v-text="text('checkbox')"></p>
        </div>
        <div class="mt-row" v-else-if="s.state === 'progress'">
          <img class="mt-spin" :src="staticBase + 'icons/spinner.svg'" alt="" aria-hidden="true">
          <p class="mt-txt"><span v-text="text(s.key)"></span> <b class="mt-pct" v-if="s.pct" v-text="s.pct + '%'"></b></p>
        </div>
        <div class="mt-row mt-col" v-else-if="s.state === 'captcha'">
          <div class="mt-widget" id="vf-widget"></div>
          <p class="mt-txt" v-text="text('captcha')"></p>
        </div>
        <div class="mt-row" v-else-if="s.state === 'success'">
          <span class="mt-mark mt-ok" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L9.5 18 L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <p class="mt-txt" v-text="text('success')"></p>
        </div>
        <div class="mt-row" v-else-if="s.state === 'error'">
          <span class="mt-mark mt-no" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
          <p class="mt-txt" v-text="text('error')"></p>
        </div>
      </div>
    </main>

    <main class="mt-main" v-else-if="showWait">
      <h1 class="mt-title" v-text="text('waitTitle')"></h1>
      <p class="mt-sub mt-sub-wait" v-text="text('waitText')"></p>
    </main>

    <main class="mt-main" v-else-if="s.state === 'fatal'">
      <h1 class="mt-title" v-text="text(s.key === 'direct' ? 'directTitle' : 'failTitle')"></h1>
      <p class="mt-sub mt-sub-wait" v-text="text(s.key === 'error' ? 'errorFatal' : s.key)"></p>
      <button type="button" class="mt-btn" v-if="s.retry" @click="retryClick()" v-text="text('retry')"></button>
    </main>

    <footer class="mt-foot">
      <p class="mt-brand">antiddos.lol DDoS Mitigation</p>
      <p class="mt-contact" v-if="showWait || s.state === 'fatal'"><span v-text="text('contact')"></span> <a href="mailto:support@antiddos.lol">support@antiddos.lol</a></p>
    </footer>
  </div>

<script src="/api/guard/core"></script>
<script type="module" src="https://cdn.antiddos.lol/ui.js"></script>
</body>
</html>
