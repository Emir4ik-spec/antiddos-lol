<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification required | antiddos.lol</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.antiddos.lol/verify.css">
<style>[v-cloak]{display:none}</style>
</head>
<body>
  <div id="guard-page" class="guard-page" v-cloak :class="{ 'guard-page-glow': s.mode === 'card', 'theme-light-container': s.theme === 'light' }">
    <template v-if="s.mode === 'card'">
      <div class="guard-sky" aria-hidden="true"></div>
      <div class="guard-obj a" aria-hidden="true"></div>
      <div class="guard-obj b" aria-hidden="true"></div>
      <div class="guard-obj c" aria-hidden="true"></div>
      <div class="guard-obj d" aria-hidden="true"></div>
      <div class="guard-obj e" aria-hidden="true"></div>
      <div class="guard-obj f" aria-hidden="true"></div>
      <div class="guard-wall" aria-hidden="true"><span class="m1">antiddos.lol</span><span class="m2">antiddos.lol</span></div>
    </template>

    <div id="guard-content" class="guard-content">
      <div class="vf-page" v-if="s.mode === 'card' && s.state !== 'fatal'">
        <div class="vfc">
          <a class="vfc-brand" href="https://antiddos.lol" target="_blank" rel="noopener"><img class="vfc-brand-logo" :src="staticBase + 'brand-logo.svg'" alt=""><span>antiddos.lol</span></a>
          <div class="vf vfc-card">
            <div class="vf-card">
              <div class="vf-slot">
                <div class="vf-row" :class="{ 'vf-row-out': s.leaving }" v-if="s.state === 'ready'">
                  <input id="antiddos-check" class="vf-cbx-in" type="checkbox">
                  <label class="vf-cbx" for="antiddos-check" @click.prevent="click()"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L9.5 18 L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
                  <p class="vf-txt vf-txt-big" v-text="text('checkbox')"></p>
                </div>
                <div class="vf-row" :class="{ 'vf-row-out': s.leaving }" v-else-if="s.state === 'progress'">
                  <img class="vf-spin" :src="staticBase + 'icons/spinner.svg'" alt="" aria-hidden="true">
                  <p class="vf-txt"><span v-text="text(s.key)"></span> <b class="vf-pct" v-if="s.pct" v-text="s.pct + '%'"></b></p>
                </div>
                <div class="vf-row vf-row-col" :class="{ 'vf-row-out': s.leaving }" v-else-if="s.state === 'captcha'">
                  <div class="vf-widget" id="vf-widget"></div>
                  <p class="vf-txt" v-text="text('captcha')"></p>
                </div>
                <div class="vf-row" :class="{ 'vf-row-out': s.leaving }" v-else-if="s.state === 'success'">
                  <span class="vf-mark vf-ok" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L9.5 18 L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                  <p class="vf-txt" v-text="text('success')"></p>
                </div>
                <div class="vf-row" :class="{ 'vf-row-out': s.leaving }" v-else-if="s.state === 'error'">
                  <span class="vf-mark vf-no" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>
                  <p class="vf-txt" v-text="text('error')"></p>
                </div>
              </div>
              <div class="vf-host">
                <img class="vf-logo" :src="s.logo" :alt="s.host + ' logo'" @error="logoFallback($event)">
                <span class="vf-host-n" v-text="s.host"></span>
              </div>
            </div>
          </div>
          <div class="vfc-foot">
            <span class="vfc-foot-t" v-text="text('contact')"></span>
            <a class="vf-link vfc-link" href="https://t.me/zertix_support" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M21.9 4.6 18.7 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.3-8.4c.4-.4-.1-.6-.6-.2L6.6 13 1.7 11.5c-1.1-.3-1.1-1.1.2-1.6L20.5 3c.9-.3 1.7.2 1.4 1.6Z"/></svg>
              @zertix_support
            </a>
          </div>
        </div>
      </div>

      <div class="vf-silent" v-if="s.state === 'fatal' || s.mode === 'passive' || s.mode === 'invisible'">
        <div class="vf-load" v-if="s.state === 'progress' && (s.mode === 'invisible' || s.slow)">
          <img class="vf-spin vf-spin-lg" :src="staticBase + 'icons/spinner.svg'" alt="" aria-hidden="true">
          <p class="vf-load-t" v-if="s.mode === 'invisible'" v-text="text('loading')"></p>
        </div>
        <div class="vf-fail" v-if="s.state === 'fatal'">
          <p class="vf-fail-t" v-text="text(s.key)"></p>
          <button type="button" class="vf-btn" v-if="s.retry" @click="retryClick()" v-text="text('retry')"></button>
        </div>
      </div>
    </div>
  </div>

<script src="/api/guard/core"></script>
<script type="module" src="https://cdn.antiddos.lol/ui.js"></script>
</body>
</html>
