<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification required | antiddos.lol</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="https://cdn.antiddos.lol/favicon.svg">
<link rel="alternate icon" href="https://cdn.antiddos.lol/favicon.ico">
<link rel="apple-touch-icon" href="https://cdn.antiddos.lol/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.antiddos.lol/verify.css?v=14">
<style>[v-cloak]{display:none}</style>
</head>
<body>
  <div id="guard-page" class="mt" v-cloak :class="{ 'mt-light': s.theme === 'light' }">

    <main class="mt-main" v-if="s.mode === 'card' && s.state !== 'fatal'">
      <h1 class="mt-title" v-text="text('title')"></h1>
      <p class="mt-sub" v-text="text('lead')"></p>
      <div class="mt-card" :class="['is-' + s.state, { 'mt-out': s.leaving }]">
        <template v-if="s.state === 'captcha'">
          <div class="mt-col">
            <div class="mt-widget" id="vf-widget"></div>
            <p class="mt-txt" v-text="text('captcha')"></p>
          </div>
        </template>
        <template v-else>
          <div class="mt-ind">
            <template v-if="s.state === 'ready'">
              <input id="antiddos-check" class="mt-cbx-in" type="checkbox">
              <label class="mt-cbx" for="antiddos-check" @click.prevent="click()"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19.5 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
            </template>
            <span class="mt-ringwrap" :class="{ 'is-spin': !s.pct }" v-else-if="s.state === 'progress'" aria-hidden="true"><svg class="mt-ring" viewBox="0 0 24 24">
              <circle class="mt-ring-bg" cx="12" cy="12" r="9"/>
              <circle class="mt-ring-fg" cx="12" cy="12" r="9" :style="{ strokeDashoffset: 56.55 * (1 - (s.pct || 28) / 100) }"/>
            </svg></span>
            <span class="mt-mark mt-ok" v-else-if="s.state === 'success'" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 L10 17.5 L19.5 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="mt-mark mt-no" v-else-if="s.state === 'error'" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 7 L17 17 M17 7 L7 17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
          </div>
          <p class="mt-txt"><span v-text="text(s.key)"></span> <b class="mt-pct" v-if="s.pct && s.state === 'progress'" v-text="s.pct + '%'"></b></p>
          <div class="mt-by" aria-hidden="true"><img :src="staticBase + 'brand-logo.svg'" alt=""><span v-text="text('by')"></span></div>
        </template>
      </div>
    </main>

    <main class="mt-main" v-else-if="showWait">
      <h1 class="mt-title" v-text="text('waitTitle')"></h1>
      <p class="mt-sub mt-sub-wait" v-text="text('waitText')"></p>
    </main>

    <main class="mt-main" v-else-if="s.state === 'fatal'">
      <h1 class="mt-title" v-text="text(s.key === 'direct' ? 'directTitle' : 'failTitle')"></h1>
      <p class="mt-sub mt-sub-wait" v-text="text(s.key === 'error' ? 'errorFatal' : s.key)"></p>
      <button type="button" class="mt-btn" v-if="s.retry" @click="retryClick()" v-text="text('retry')"></button>
    </main>

    <footer class="mt-foot" v-if="s.state !== 'boot'">
      <p class="mt-brand"><a href="https://antiddos.lol" target="_blank" rel="noopener">AntiDDos DDos Mitigation</a></p>
      <p class="mt-contact" v-if="showWait || s.state === 'fatal'"><span v-text="text('contact')"></span> <a href="mailto:support@antiddos.lol">support@antiddos.lol</a></p>
    </footer>
  </div>

<script src="/api/guard/core"></script>
<script type="module" src="https://cdn.antiddos.lol/ui.js?v=14"></script>
</body>
</html>
